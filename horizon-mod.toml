# Theurgy for Horizon — one flat SDK package (mod API 0.2).
#
# The calcination process: a pyromantic brazier burns furnace fuel and publishes a `lit`
# state, and an oven on top of it turns one item into its alchemical salt — 86 carried
# recipes, a heat sample every 20 ticks, a 100-tick craft, and an empty hand that takes the
# result. Two block entities with item slots, one container each, and three readout commands.
#
# Ported from Theurgy 1.78.0 (klikli-dev/theurgy, MIT AND CC-BY-4.0; the jar declares both).
# Local-only until the maintainer approves publishing (ARCHITECTURE.md §8).
id = "theurgy"
name = "Theurgy"
# The port's own version, not the original mod's 1.78.0: the retired `.hnmod` bundle was 0.1.0
# and a resubmission is always a new version. This is the first publication.
version = "0.2.0"
description = """The calcination half of Theurgy: a pyromantic brazier that burns furnace fuel and a calcination oven above it that turns 86 carried ingredients — ores, gems, ingots, plants, creature remains, stone and ice — into alchemical salts while the brazier below is lit. A coal heats sixteen crafts; a stick heats one. The other nine processes, the fluid apparatus, the divination rods and the GeckoLib renderers are not ported yet."""
authors = ["klikli-dev (upstream)", "Horizon native mod contributors"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity.
api = "0.2"
# The installation side, not the hook's: an integrated server belongs to the client
# installation, so a LAN host or a single-player world needs both.
side = "both"
# The schema's one value ("May add blocks, items, mob effects and entity types"). This
# package does declare two blocks, seven items and two block entity types; the field is
# required by the schema either way.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
