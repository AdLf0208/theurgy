[package]
# Ported from: Theurgy 1.120.1 (klikli-dev/theurgy), Minecraft Java 26.3 NeoForge.
# The Cargo package name is not the mod's identity: the only identity is `id` in horizon-mod.toml.
name = "horizon-theurgy"
version = "0.3.0"
edition = "2024"
# The Rust code in src/ is MIT. Carried upstream assets (assets/, data/) are CC-BY-4.0
# with third-party notices in LICENSE-NOTICE.md and THIRD_PARTY_NOTICES.md.
license = "MIT"
description = "Theurgy for Horizon: classical alchemy machines, fluids, mercury flux, logistics, tools and the Hermetica"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by `cargo horizon-mod`.
# `mod_api::serde_json` is re-exported directly by `horizon-mod-api`.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
